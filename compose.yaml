name: nebuctf
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://nebuctf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/nebuctf
  APP_SECRET: ${APP_SECRET:?set APP_SECRET}
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CAPTCHA_DIFFICULTY: ${CAPTCHA_DIFFICULTY:-20}
  DATA_DIR: /data
  TRUST_PROXY: 172.30.80.10
  IMAGE_PREFIXES: ${IMAGE_PREFIXES:-nebuctf/}
  CHALLENGE_HOST: ${CHALLENGE_HOST:-localhost}
  CHALLENGE_BIND: ${CHALLENGE_BIND:-127.0.0.1}
  CHALLENGE_PORT_RANGE: ${CHALLENGE_PORT_RANGE:-}
  CHALLENGE_DOMAIN: ${CHALLENGE_DOMAIN:-labs.localhost}
  DOMAIN_SCHEME: ${DOMAIN_SCHEME:-https}
  GATEWAY_CONTAINER: nebuctf-gateway
  MAX_INSTANCES: ${MAX_INSTANCES:-64}
  MAX_OWNER_INSTANCES: ${MAX_OWNER_INSTANCES:-2}
  MAX_CPU: ${MAX_CPU:-16000}
  MAX_MEMORY: ${MAX_MEMORY:-16384}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nebuctf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nebuctf
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [platform]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nebuctf -d nebuctf"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  api:
    build: { context: ., target: api }
    image: nebuctf-platform:local
    environment: *app-env
    volumes: [files:/data]
    networks: [platform]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
  gateway:
    image: nebuctf-platform:local
    build: { context: ., target: api }
    container_name: nebuctf-gateway
    labels: { io.nebuctf.gateway: "true" }
    command: [node, dist/gateway-main.js]
    environment: *app-env
    networks: [platform]
    ports: ["127.0.0.1:${GATEWAY_HTTP_PORT:-8081}:8081"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
  worker:
    image: nebuctf-platform:local
    build: { context: ., target: api }
    command: [node, dist/worker-main.js]
    # Socket group grants Docker administration. Keep this service on a trusted worker node.
    user: "1000:${DOCKER_GID:-0}"
    environment: *app-env
    volumes:
      - files:/data
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks: [platform]
    depends_on:
      {
        db: { condition: service_healthy },
        gateway: { condition: service_healthy },
      }
    stop_grace_period: 120s
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/worker-health','utf8'))<120000?0:1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
  web:
    build: { context: ., target: web }
    ports: ["${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"]
    networks:
      platform: { ipv4_address: 172.30.80.10 }
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    logging: *logging
networks:
  platform:
    ipam:
      config: [{ subnet: 172.30.80.0/24 }]
volumes:
  postgres:
  files:
