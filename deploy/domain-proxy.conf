# Host Nginx configuration. Replace labs.example.net and certificate paths.
# Keep challenge domains on a separate registrable domain from the platform where possible.
map $http_upgrade $nebu_connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=challenges:10m rate=30r/s;
server {
    listen 80;
    server_name *.labs.example.net;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name *.labs.example.net;
    ssl_certificate /etc/ssl/nebuctf-labs/fullchain.pem;
    ssl_certificate_key /etc/ssl/nebuctf-labs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    location / {
        limit_req zone=challenges burst=80 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nebu_connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 7200s;
    }
}
