# No host condition: the platform works at the literal IP origin.
# No TLS block and no made-up certificate for this HTTP deployment.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nebuctf
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,legacy
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
