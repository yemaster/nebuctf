apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: nebuctf-data
  resources:
    requests:
      storage: 16Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traffic
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: nebuctf-traffic
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-assets
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: nebuctf-web-assets
  resources:
    requests:
      storage: 2Gi
