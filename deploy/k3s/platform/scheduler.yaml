apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
    spec:
      serviceAccountName: scheduler
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: tencent-sh
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: nebuctf-api:local
          imagePullPolicy: Never
          command: [node, dist/scheduler-main.js]
          envFrom:
            - configMapRef:
                name: app-config
            - configMapRef:
                name: scheduler-config
            - secretRef:
                name: scheduler-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 192Mi
          startupProbe:
            exec:
              command: [node, -e, "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/scheduler-health','utf8'))<120000?0:1)"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [node, -e, "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/scheduler-health','utf8'))<120000?0:1)"]
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [node, -e, "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/scheduler-health','utf8'))<120000?0:1)"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
