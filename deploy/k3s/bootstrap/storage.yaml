# These local PVs deliberately survive PVC deletion. No dynamic provisioner.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: platform-postgres
spec:
  capacity:
    storage: 12Gi
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: platform-data
    name: postgres
  local:
    path: /srv/platform/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [tencent-sh]
