apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
        allocateLoadBalancerNodePorts: false
    ports:
      legacy:
        port: 61001
        exposedPort: 61001
        expose:
          default: true
        protocol: TCP
    # Preserve standard web/websecure entrypoints (80/443). No TLS certificate
    # or HTTP-to-HTTPS redirect is configured for the IP-origin deployment.
