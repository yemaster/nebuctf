apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-data
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 768Mi
    pods: "3"
    persistentvolumeclaims: "1"
    requests.storage: 12Gi
    services: "2"
    services.nodeports: "0"
    services.loadbalancers: "0"
    secrets: "8"
    configmaps: "8"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nebuctf
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [api, scheduler]
        # Docker addresses are fixed. The bridge host address accommodates
        # kube-proxy/host SNAT; host firewall remains part of this boundary.
        - ipBlock:
            cidr: 172.31.80.3/32
        - ipBlock:
            cidr: 172.31.80.4/32
        - ipBlock:
            cidr: 172.31.80.1/32
      ports:
        - protocol: TCP
          port: 5432
