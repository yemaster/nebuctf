map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;
  client_max_body_size 21m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    limit_req zone=api burst=60 nodelay;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_request_buffering on;
  }
  location /assets/ { try_files $uri =404; expires 1y; }
  location ~ ^/assets/[^/]+\.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
    expires 1y;
  }
  location / { try_files $uri $uri/ /index.html; }
}
