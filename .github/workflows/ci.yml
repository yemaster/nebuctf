name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nebuctf
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: nebuctf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nebuctf -d nebuctf_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
        env:
          REQUIRE_DB_TESTS: '1'
      - run: node --import tsx --test apps/api/test/integration.test.ts
        env:
          TEST_POSTGRES: '1'
          DATABASE_URL: postgres://nebuctf:ci-test-only@localhost:5432/nebuctf_test
      - run: npm run build
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-configuration-only-password
          APP_SECRET: ci-configuration-only-secret-minimum-32-characters
      - run: docker build --target api .
      - run: docker build --target web .
